: 0 8px\">\n<span class=\"tag\">학부모 가이드 2026<\/span>\n<h1 class=\"h\" style=\"margin-top: 32px; font-size: 80px\">‘스쿼시가 가장 강한 학교’가 아니라,<br>우리 아이에게 맞는<br>다음 4년<\/h1>\n<p class=\"sub\">미국 보딩스쿨·대학 스쿼시, 학부모가 먼저 알아야 할 것들<\/p>\n<\/div>\n<div class=\"bt\"><span style=\"font-weight: 500\">@wellperion__squash<\/span><span class=\"sw\">저장하고 넘겨보기<svg width=\"36\" height=\"36\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\/path><\/svg><\/span><\/div>\n<\/div>\n<\/body><\/html>"},{"title":"2/5 학교 스쿼시 구조","file":"Guide-2.dc.html","doc":"<!doctype html><html lang=\"ko\"><head><meta charset=\"utf-8\"><\/head><body>\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\na{color:#B5343C}a:hover{color:#8A2229}\n.f{width:1080px;height:1080px;box-sizing:border-box;font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column;padding:44px 56px 40px}\n.sg{background:#74897D;color:#FFFFFF}\n.hd,.ft{display:flex;align-items:center;gap:24px}\n.ln{flex:1;height:2px;background:rgba(255,255,255,0.75)}\n.lg{height:30px;width:auto}\n.ct{font-size:22px;font-weight:700}\n.hn{font-size:24px;font-weight:500}\n.cd{flex:1;min-height:0;margin:30px 0;background:#FFFFFF;color:#1A1A1A;border-radius:28px;padding:52px 52px 44px;display:flex;flex-direction:column}\n.k{font-size:28px;font-weight:700;color:#B5343C}\n.h{margin:14px 0 0;font-weight:900;letter-spacing:-0.04em;line-height:1.14;word-break:keep-all}\n.bx{background:#EEF2EF;border-radius:18px;padding:22px 24px}\n.n{flex-shrink:0;width:44px;height:44px;border-radius:999px;background:#74897D;color:#FFFFFF;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center}\n.row{display:flex;gap:18px;align-items:flex-start}\n n<\/body><\/html>"},{"title":"4/5 지원 타임라인","file":"Guide-4.dc.html","doc":"<!doctype html><html lang=\"ko\"><head><meta charset=\"utf-8\"><\/head><body>\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\na{color:#B5343C}a:hover{color:#8A2229}\n.f{width:1080px;height:1080px;box-sizing:border-box;font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column;padding:44px 56px 40px}\n.sg{background:#74897D;color:#FFFFFF}\n.hd,.ft{display:flex;align-items:center;gap:24px}\n.ln{flex:1;height:2px;background:rgba(255,255,255,0.75)}\n.lg{height:30px;width:auto}\n.ct{font-size:22px;font-weight:700}\n.hn{font-size:24px;font-weight:500}\n.cd{flex:1;min-height:0;margin:30px 0;background:#FFFFFF;color:#1A1A1A;border-radius:28px;padding:48px 52px 36px;display:flex;flex-direction:column}\n.k{font-size:28px;font-weight:700;color:#B5343C}\n.h{margin:12px 0 0;font-weight:900;letter-spacing:-0.04em;line-height:1.14;word-break:keep-all}\n.st{display:flex;gap:22px;align-items:flex-start;padding:13px 0;border-bottom:2px solid #E3E9E5}\n.wh{flex-shrink:0;width:210px;font-size:22px;font-weight:900;color:#74897D;line-height:1.4}\n.t{font-size:26px;font-weight:900;line-height:1.35;word-break:keep-all}\n.s{margin-top:2px;font-size:21px;color:#555555;line-height:1.45;word-break:keep-all}\n<\/style>\n\n<div class=\"f sg\">\n<div class=\"hd\"><div class=\"ln\"><\/div><img class=\"lg\" src=\"LOGO_SRC\" alt=\"Wellperion\"><div class=\"ln\"><\/div><span class=\"ct\">4 / 5<\/span><\/div>\n<div class=\"cd\">\n<div class=\"k\">Application timeline<\/div>\n<h1 class=\"h\" style=\"font-size: 60px\">지원까지, 언제 무엇을<\/h1>\n<div style=\"margin-top: auto\">\n<div class=\"st\"><span class=\"wh\">지원 2–3년 전<\/span><div><div class=\"t\">경기 기록 쌓기<\/div><div class=\"s\">국내·해외 주니어 대회로 객관적 기록을 만들어요<\/div><\/div><\/div>\n<div class=\"st\"><sp nd:#74897D;display:flex;align-items:center;justify-content:center}\n<\/style>\n\n<div class=\"f sg\">\n<div class=\"hd\"><div class=\"ln\"><\/div><img class=\"lg\" src=\"LOGO_SRC\" alt=\"Wellperion\"><div class=\"ln\"><\/div><span class=\"ct\">5 / 5<\/span><\/div>\n<div style=\"margin-top: 70px; padding: 0 8px\">\n<h1 class=\"h\" style=\"font-size: 82px\">학교·선수·대학 데이터,<br>한곳에서<\/h1>\n<div style=\"margin-top: 40px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px\">\n<div class=\"nb\"><div style=\"font-size: 72px; font-weight: 900; line-height: 1\">30<span style=\"font-size: 32px\">곳<\/span><\/div><div style=\"margin-top: 8px; font-size: 24px; font-weight: 700; word-break: keep-all\">스쿼시 팀이 있는 미국 보딩스쿨<\/div><\/div>\n<div class=\"nb\"><div style=\"font-size: 72px; font-weight: 900; line-height: 1\">37<span style=\"font-size: 32px\">곳<\/span><\/div><div style=\"margin-top: 8px; font-size: 24px; font-weight: 700; word-break: keep-all\">varsity 스쿼시 팀이 있는 대학<\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"cta\" style=\"margin-top: auto\">\n<div><div style=\"font-size: 24px; font-weight: 700; color: #B5343C\">이상훈 코치가 직접 정리한<\/div><div style=\"margin-top: 2px; font-size: 36px; font-weight: 900\">프로필 링크 → 스쿼시 가이드<\/div><\/div>\n<span class=\"ar\"><svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\/path><\/svg><\/span>\n<\/div>\n<div class=\"ft\" style=\"margin-top: 30px\"><div class=\"ln\"><\/div><span class=\"hn\">@wellperion__squash<\/span><div class=\"ln\"><\/div><\/div>\n<\/div>\n<\/body><\/html>"}]},{"id":"tips","name":"코치의 팁","cards":[{"title":"팁 #2 라켓 준비","file":"Tips-2.dc.html","doc":"<!doctype html><html lang=\"ko\"><head><meta charset=\"utf-8\"><\/head><body>\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\na{color:#B5343C}a:hover{color:#8A2229}\n.f{width:1080px;height:1080px;box-sizing:border-box;font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column;padding:56px 60px 40px}\n.wt{background:#FFFFFF;color:#1A1A1A}\n.h{margin:0;font-weight:900;letter-spacing:-0.04em;line-height:1.14;word-break:keep-all}\n.p{margin:24px 0 0;font-size:28px;line-height:1.6;color:#444444;word-break:keep-all}\n.pl{display:inline-block;background:#74897D;color:#FFFFFF;border-radius:999px;padding:8px 22px;font-size:24px;font-weight:700}\n.bx{background:#EEF2EF;border-radius:18px;padding:20px 24px}\n.sk{font-size:20px;font-weight:900;color:#B5343C}\n.t{margin-top:4px;font-size:25px;font-weight:700;line-height:1.4;word-break:keep-all}\n.cmp{flex:1;border-radius:22px;padding:26px 28px}\n<\/style>\n\n<div class=\"f wt\">\n<div><span class=\"pl\">코치의 팁 #2<\/span><\/div>\n<h1 class=\"h\" style=\"margin-top: 32px; font-size: 92px; color: #74897D\">라켓은<br>미리 올려두기<\/h1>\n<p class=\"p\">공이 오고 나서 라켓을 드는 순간 이미 늦어요. 준비가 빠르면 스윙은 짧고 정확해집니다.<\/p>\n<div style=\"margin-top: 36px; display: flex; gap: 14px\">\n<div class=\"cmp\" style=\"background: #F6E3E4\"><div style=\"font-size: 22px; font-weight: 900; color: #B5343C\">BEFORE<\/div><div style=\"margin-top: 8px; font-size: 28px; font-weight: 900; word-break: keep-all\">라켓이 무릎 아래<\/div><div style=\"margin-top: 4px; font-size: 22px; color: #555555; word-break: keep-all\">늦은 백스윙 → 밀리는 타구<\/div><\/div>\n<div class=\"cmp\" style=\"background: #EEF2EF\"><div style=\"font-size: 22px; font-weight: 900; color: #56695E\">AFTER<\/div><div style=\"margin-top: 8px; font-size: 28px; font-weight: 900; word-break: keep-all\">라켓 헤드는 손목 위<\/div><div style=\"margin-top: 4px; font-size: 22px; color: #555555; word-break: keep-all\">짧은 백스윙 → 정확한 타구<\/div><\/div>\n<\/div>\n<div style=\"margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px\">\n<div class=\"bx\"><div class=\"sk\">STEP 1<\/div><div class=\"t\">준비 자세에서 라켓을 위로<\/div><\/div>\n<div class=\"bx\"><div class=\"sk\">STEP 2<\/div><div class=\"t\">공 방향을 읽는 순간 백스윙<\/div><\/div>\n<div class=\"bx\"><div class=\"sk\">STEP 3<\/div><div class=\"t\">짧고 간결하게 스윙<\/div><\/div>\n<\/div>\n<div style=\"margin-top: 26px; text-align: center; font-size: 24px; font-weight: 500; color: #333333\">@wellperion__squash<\/div>\n<\/div>\n<\/body><\/html>"},{"title":"팁 #3 길게 치기","file":"Tips-3.dc.html","doc":"<!doctype html><html lang=\"ko\"><head><meta charset=\"utf-8\"><\/head><body>\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\na{color:#B5343C}a:hover{color:#8A2229}\n.f{width:1080px;height:1080px;box-sizing:border-box;font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column;padding:56px 60px 40px}\n.wt{background:#FFFFFF;color:#1A1A1A}\n.h{margin:0;font-weight:900;letter-spacing:-0.04em;line-height:1.14;word-break:keep-all}\n.p{margin:24px 0 0;font-size:27px;line-height:1.6;color:#444444;word-break:keep-all}\n.pl{display:inline-block;background:#74897D;color:#FFFFFF;border-radius:999px;padding:8px 22px;font-size:24px;font-weight:700}\n.bx{background:#EEF2EF;border-radius:18px;padding:20px 24px}\n.sk{font-size:20px;font-weight:900;color:#B5343C}\n.t{margin-top:4px;font-size:25px;font-weight:700;line-height:1.4;word-break:keep-all}\n<\/style>\n\n<div class=\"f wt\">\n<div><span class=\"pl\">코치의 팁 #3<\/span><\/div>\n<div style=\"margin-top: 32px; display: flex; gap: 44px; align-items: flex-start\">\n<div style=\"flex: 1; min-width: 0\">\n<h1 class=\"h\" style=\"font-size: 88px; color: #74897D\">길게,<br>벽에 붙여서<\/h1>\n<p class=\"p\">초보 랠리의 대부분은 짧은 공에서 끝나요. 드라이브를 백코트 코너까지 깊게, 옆벽에 붙여 보내면 상대는 T를 내주고 뒤로 물러나야 합니다.<\/p>\n<\/div>\n<svg width=\"300\" height=\"456\" viewBox=\"0 0 390 592   b.type = 'button'; b.textContent = x.name; b.dataset.id = x.id;
  b.addEventListener('click', () => setFont(x));
  fontBar.appendChild(b);
}
function setFont(x) {
  font = x;
  try { localStorage.setItem('cardFont', x.id); } catch (e) {}
  fontBar.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === x.id));
  document.querySelectorAll('.frame iframe').forEach((fr, i) => { fr.srcdoc = docFor(flat[i]); });
  if (!lb.hidden) show(cur);
}

function makeFrame(card) {
  const f = document.createElement('iframe');
  f.setAttribute('sandbox', '');
  f.setAttribute('loading', 'lazy');
  f.setAttribute('tabindex', '-1');
  f.title = card.title;
  f.srcdoc = docFor(card);
  return f;
}

for (const g of groups) {
  const a = document.createElement('a');
  a.href = '#' + g.id; a.textContent = g.name;
  tabs.appendChild(a);
  const sec = document.createElement('section');
  sec.className = 'theme'; sec.id = g.id;
  const h = document.createElement('h2');
  h.textContent = g.name;
  const n = document.createElement('span'); n.textContent = g.cards.length + '장';
  h.appendChild(n); sec.appendChild(h);
  const grid = document.createElement('div'); grid.className = 'grid';
  for (const c of g.cards) {
    const i = flat.length; flat.push({ ...c, group: g.name });
    const fig = document.createElement('figure');
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'frame';
    btn.setAttribute('aria-label', g.name + ' · ' + c.title + ' 크게 보기');
    btn.appendChild(makeFrame(c));
    btn.addEventListener('click', () => openLb(i));
    const cap = document.createElement('figcaption');
    const b = document.createElement('b'); b.textContent = c.title;
    const code = document.createElement('code'); code.textContent = c.file;
    cap.append(b, code);
    fig.append(btn, cap); grid.appendChild(fig);
  }
  sec.appendChild(grid); main.appendChild(sec);
}

function fit() {
  document.querySelectorAll('.frame').forEach(fr => {
    const s = fr.clientWidth / 1080;
    fr.firstChild.style.transform = 'scale(' + s + ')';
  });
}
new ResizeObserver(fit).observe(main);
fit();

const lb = document.getElementById('lb'), big = document.getElementById('lbBig'), lbTitle = document.getElementById('lbTitle');
let cur = 0, lastFocus = null;
function sizeBig() {
  const side = Math.min(window.innerWidth - 32, window.innerHeight - 110);
  big.style.width = side + 'px'; big.style.height = side + 'px';
  if (big.firstChild) big.firstChild.style.transform = 'scale(' + side / 1080 + ')';
}
function show(i) {
  cur = (i + flat.length) % flat.length;
  big.replaceChildren(makeFrame(flat[cur]));
  lbTitle.textContent = flat[cur].group + ' · ' + flat[cur].title + ' (' + (cur + 1) + '/' + flat.length + ')';
  sizeBig();
}
function openLb(i) { lastFocus = document.activeElement; lb.hidden = false; show(i); document.getElementById('lbClose').focus(); }
function closeLb() { lb.hidden = true; big.replaceChildren(); if (lastFocus) lastFocus.focus(); }
document.getElementById('lbPrev').onclick = () => show(cur - 1);
document.getElementById('lbNext').onclick = () => show(cur + 1);
document.getElementById('lbClose').onclick = closeLb;
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
document.addEventListener('keydown', e => {
  if (lb.hidden) return;
  if (e.key === 'Escape') closeLb();
  else if (e.key === 'ArrowRight') show(cur + 1);
  else if (e.key === 'ArrowLeft') show(cur - 1);
});
window.addEventListener('resize', () => { if (!lb.hidden) sizeBig(); });
fontBar.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === font.id));
</script>
